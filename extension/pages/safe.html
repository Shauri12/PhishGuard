<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>✅ PhishGuard – Safe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0D1117;
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: #F1F5F9;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 600px 400px at 50% 20%, rgba(0,200,150,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      text-align: center;
      animation: float-in 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes float-in {
      from { opacity:0; transform:scale(0.85); }
      to   { opacity:1; transform:scale(1); }
    }
    .check-ring {
      width: 100px; height: 100px; margin: 0 auto 24px;
      border: 3px solid rgba(0,200,150,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      background: rgba(0,200,150,0.08);
    }
    h1 { font-size: 28px; font-weight: 800; color: #34D399; margin-bottom: 10px; }
    p  { font-size: 14px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-ring">✅</div>
    <h1>Site Looks Safe</h1>
    <p>PhishGuard did not detect phishing indicators on this page.</p>
  </div>
</body>
</html>
